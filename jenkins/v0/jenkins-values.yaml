controller:
  nodeSelector:
    kubernetes.io/os: linux
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 1000m
      memory: 3Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  servicePort: 8080
  serviceType: NodePort
  securityContext:
    runAsUser: 1000
    runAsGroup: 999
    fsGroup: 999

  extraVolumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
        type: Socket

  extraVolumeMounts:
    - name: docker-sock
      mountPath: /var/run/docker.sock
